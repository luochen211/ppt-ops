name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node src/cli.js html-qa projects/ai-delivery-first-order/ppt/index.html
      - run: node src/cli.js validate examples/demo-project
      - run: node --test test/boundary-images.test.js test/integration.test.js
